<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Simple Interest Calculator</h1>
        <p class="subtitle">By jishemaro</p>
        
        <form id="interestForm">
            <!-- Principal Input -->
            <div class="input-group">
                <label for="principal">Principal Amount ($)</label>
                <input type="number" id="principal" min="0" step="0.01" placeholder="e.g. 1000" required>
            </div>

            <!-- Interest Rate Input -->
            <div class="input-group">
                <label for="rate">Annual Interest Rate (%)</label>
                <input type="number" id="rate" min="0" step="0.01" placeholder="e.g. 5" required>
            </div>

            <!-- Time Period Input -->
            <div class="input-group">
                <label for="time">Time Period</label>
                <div class="time-input-container">
                    <input type="number" id="time" min="0" step="0.1" placeholder="e.g. 2" required>
                    <select id="timeUnit">
                        <option value="years">Years</option>
                        <option value="months">Months</option>
                    </select>
                </div>
            </div>

            <!-- Actions -->
            <div class="button-group">
                <button type="submit" class="btn-calculate">Calculate</button>
                <button type="button" id="btnClear" class="btn-clear">Clear</button>
            </div>
        </form>

        <!-- Dynamic Results Section -->
        <div id="resultSection" class="results hidden">
            <h3>Calculation Summary</h3>
            <hr>
            <div class="result-row">
                <span>Initial Principal:</span>
                <span id="resPrincipal">$0.00</span>
            </div>
            <div class="result-row">
                <span>Total Interest:</span>
                <span id="resInterest" class="highlight">$0.00</span>
            </div>
            <div class="result-row total">
                <span>Final Balance:</span>
                <span id="resTotal">$0.00</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
